$schema: https://json-schema.org/draft/2020-12/schema
title: Payment
type: object
additionalProperties: false
description: "A high-value action: every write must be a signed request"
x-access:
  signed:
    - create
    - update
    - delete
  audited:
    - create
    - update
    - delete
properties:
  amount:
    description: Amount in the smallest currency unit
    type: integer
  currency:
    description: ISO 4217 currency code
    type: string
    minLength: 3
    maxLength: 3
required:
  - amount
  - currency
